<title>錄取簽呈表 | 永隆工程</title>

<!--
  ============================================================
  錄取簽呈線上簽核系統（初版）
  流程：人資部初面 → 面試主管 → 單位主管 → 部門主管 → 董事長/總經理 → 總管理處

  部署前請完成以下設定：

  1. Firebase：獨立專案 yl-hire-approval。
     使用集合 hireApprovals 與 salaryItems（薪資項目，本專案自有一份）。

  2. Firestore 安全規則（Firebase Console → Firestore → 規則），請「新增」hireApprovals 這一段：
     rules_version = '2';
     service cloud.firestore {
       match /databases/{database}/documents {
         match /interviews/{docId}      { allow read, write: if true; }
         match /salaryItems/{itemId}    { allow read, write: if true; }
         match /hireApprovals/{docId}   { allow read, write: if true; }
       }
     }

  2-1. Storage 安全規則（Firebase Console → Storage → 規則），請「新增」hireApprovals 這一段：
     rules_version = '2';
     service firebase.storage {
       match /b/{bucket}/o {
         match /resumes/{docId}/{fileName} { allow read, write: if true; }
         match /hireApprovals/{docId}/{kind}/{fileName} { allow read, write: if true; }
       }
     }
     ※ 個資同意書屬敏感資料，正式上線前建議改為需登入才可讀取。

  3. 管理後台密碼：搜尋 ADMIN_PASSCODE 修改。

  4. 部署：上傳到 GitHub Pages 或 Firebase Hosting，檔名 index.html。
  ============================================================
-->

<style>

  :root{
    --ink:#1B2A41;
    --ink-soft:#4A5A70;
    --paper:#F7F5F0;
    --paper-raised:#FFFFFF;
    --line:#DAD4C4;
    --brass:#A6803D;
    --brass-deep:#8A6A2E;
    --seal:#B3492B;
    --good:#4C7A5E;
    --good-bg:#EAF1EC;
    --shadow: 0 1px 2px rgba(27,42,65,0.06), 0 6px 16px rgba(27,42,65,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:'Noto Sans TC', system-ui, sans-serif;
    line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3,.serif{font-family:'Noto Serif TC', serif;}

  a{color:var(--brass-deep);}

  .letterhead{
    background:var(--ink);
    color:#F1EEE4;
    padding:22px clamp(16px,4vw,40px);
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:16px;
  }
  .letterhead .org{
    font-size:13px;
    letter-spacing:.08em;
    color:#C9BFA1;
  }
  .letterhead h1{
    margin:2px 0 0;
    font-size:clamp(20px,3vw,26px);
    font-weight:700;
    letter-spacing:.04em;
  }
  .letterhead .nav a{
    color:#E7E1CE;
    text-decoration:none;
    font-size:13px;
    border:1px solid #4A5A70;
    padding:7px 14px;
    border-radius:999px;
  }
  .letterhead .nav a:hover{border-color:var(--brass);color:#fff;}

  .wrap{
    max-width:900px;
    margin:0 auto;
    padding:clamp(16px,4vw,36px);
  }

  .card{
    background:var(--paper-raised);
    border:1px solid var(--line);
    border-radius:10px;
    box-shadow:var(--shadow);
    padding:clamp(18px,4vw,30px);
    margin-bottom:20px;
  }

  .field-row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:560px){.field-row{grid-template-columns:1fr;}}
  label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:6px;font-weight:600;}
  input[type=text],input[type=date],input[type=password],input[type=number],textarea{
    width:100%;
    border:1px solid var(--line);
    background:#fff;
    border-radius:7px;
    padding:10px 12px;
    font-size:15px;
    font-family:inherit;
    color:var(--ink);
  }
  input:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}
  textarea{resize:vertical;min-height:80px;}

  button{
    font-family:inherit;
    font-size:14px;
    font-weight:600;
    cursor:pointer;
    border-radius:8px;
    border:1px solid transparent;
    padding:11px 20px;
    transition:transform .05s ease;
  }
  button:active{transform:translateY(1px);}
  .btn-primary{background:var(--brass);color:#fff;}
  .btn-primary:hover{background:var(--brass-deep);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink);}
  .btn-ghost:hover{border-color:var(--brass);}
  .btn-danger{background:transparent;border:1px solid var(--seal);color:var(--seal);}
  button:disabled{opacity:.45;cursor:not-allowed;}

  /* ---- Stepper ---- */
  .stepper{display:flex;gap:0;margin-bottom:24px;}
  .step{
    flex:1;text-align:center;padding:12px 6px;position:relative;
    font-size:13px;font-weight:600;color:var(--ink-soft);
    border-bottom:3px solid var(--line);
  }
  .step.done{color:var(--good);border-bottom-color:var(--good);}
  .step.active{color:var(--brass-deep);border-bottom-color:var(--brass);}
  .step .sub{display:block;font-weight:400;font-size:11px;margin-top:2px;color:inherit;opacity:.8;}

  /* ---- Category evaluation ---- */
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  @media (max-width:640px){.cat-grid{grid-template-columns:1fr;}}
  .cat{
    border:1px solid var(--line);
    border-radius:9px;
    padding:14px 16px;
    background:#FCFBF8;
  }
  .cat .cat-title{
    font-weight:700;font-size:14px;margin-bottom:10px;
    display:flex;align-items:center;gap:8px;
  }
  .cat .cat-num{
    display:inline-flex;align-items:center;justify-content:center;
    width:20px;height:20px;border-radius:50%;
    background:var(--ink);color:#F1EEE4;font-size:11px;flex:none;
  }
  .opt-list{display:flex;flex-direction:column;gap:7px;}
  .opt{
    display:flex;align-items:flex-start;gap:8px;
    font-size:13.5px;color:var(--ink);
    padding:7px 9px;border-radius:6px;border:1px solid transparent;
    cursor:pointer;
  }
  .opt:hover{background:#F1ECDD;}
  .opt.selected{background:var(--good-bg);border-color:var(--good);color:#1E3A2A;font-weight:600;}
  .opt input{margin-top:3px;accent-color:var(--brass);}
  .cat .note-field{margin-top:8px;}
  .cat .note-field input{font-size:13px;padding:7px 10px;}

  .cat.readonly{background:#F4F2EC;}
  .cat.readonly .opt{cursor:default;padding:5px 0;}
  .cat.readonly .opt:hover{background:none;}
  .cat.readonly .opt.selected{background:none;border:none;padding-left:0;}
  .cat.readonly .opt:not(.selected){display:none;}
  .cat.readonly .opt.selected::before{content:"✓ ";color:var(--good);}

  .unanswered{color:var(--seal);font-size:12px;font-weight:600;}
  .req-mark{color:var(--seal);font-weight:700;margin-left:2px;}
  .comment-label{font-size:15px;font-weight:700;color:var(--ink);margin-bottom:8px;display:flex;align-items:center;gap:6px;}
  .comment-box{
    white-space:pre-wrap;
    background:#FCF8ED;
    border:1px solid var(--brass);
    border-left:4px solid var(--brass);
    border-radius:8px;
    padding:14px 16px;
    font-size:15.5px;
    line-height:1.75;
    color:var(--ink);
    min-height:50px;
    box-shadow:0 1px 3px rgba(166,128,61,0.12);
  }

  /* ---- Salary ---- */
  .salary-block{display:flex;flex-direction:column;gap:14px;}
  .salary-fixed{display:flex;flex-direction:column;gap:8px;}
  .salary-row{display:flex;justify-content:space-between;align-items:center;font-size:14px;gap:12px;}
  .salary-row label{margin:0;font-weight:600;color:var(--ink);font-size:14px;}
  .salary-row input[type=number]{max-width:160px;}
  .sal-fixed-amt{font-weight:600;color:var(--ink-soft);font-size:13.5px;white-space:nowrap;}
  .salary-variable label{display:block;font-size:13px;color:var(--ink-soft);margin-bottom:8px;font-weight:600;}
  .sal-item-list{display:flex;flex-direction:column;gap:8px;}
  .sal-item{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:8px 10px;border:1px solid var(--line);border-radius:7px;background:#FCFBF8;cursor:pointer;}
  .sal-item input[type=checkbox]{accent-color:var(--brass);flex:none;}
  .sal-item span:first-of-type{flex:1;}
  .sal-amt{max-width:120px;margin-left:auto;}
  .salary-total{border-top:1px solid var(--line);padding-top:10px;font-size:15px;font-weight:700;text-align:right;}
  .salary-total b{color:var(--brass-deep);}

  /* ---- Salary: per-record custom items + remove button ---- */
  .sal-item-custom{gap:8px;}
  .sal-custom-label{flex:1;min-width:0;border:1px solid var(--line);border-radius:6px;padding:6px 8px;font-size:13.5px;font-family:inherit;color:var(--ink);background:#fff;margin-left:0;}
  .sal-item-custom .sal-amt{margin-left:0;}
  .sal-remove-btn{border:none;background:none;color:var(--seal);font-size:17px;line-height:1;cursor:pointer;padding:2px 6px;flex:none;}
  .sal-remove-btn:hover{opacity:.6;}
  .sal-add-row{display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap;}
  .sal-add-row input[type=text]{flex:1;min-width:140px;}
  .sal-add-row input[type=number]{max-width:180px;}

  /* ---- Salary item admin (後台自訂項目管理) ---- */
  .salary-item-admin-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:7px;background:#FCFBF8;font-size:13.5px;}
  .salary-item-admin-row .item-name{flex:1;font-weight:600;}

  /* ---- Signature pad ---- */
  .sig-box{
    border:1.5px dashed var(--line);
    border-radius:9px;
    background:#fff;
    touch-action:none;
    width:100%;
    height:160px;
    display:block;
    cursor:crosshair;
  }
  .sig-tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px;}
  .sig-hint{font-size:12px;color:var(--ink-soft);}

  /* ---- Chop / stamp ---- */
  .signed-block{display:flex;align-items:center;gap:16px;flex-wrap:wrap;}
  .signed-block img{height:70px;border:1px solid var(--line);border-radius:6px;background:#fff;padding:4px;}
  .chop{
    width:64px;height:64px;border-radius:50%;
    border:2.5px solid var(--seal);color:var(--seal);
    display:flex;align-items:center;justify-content:center;
    font-family:'Noto Serif TC',serif;font-weight:700;font-size:13px;
    transform:rotate(-11deg);
    flex:none;
    text-align:center;line-height:1.2;
    opacity:.9;
  }
  .signed-meta{font-size:12.5px;color:var(--ink-soft);}
  .signed-meta b{color:var(--ink);}

  .status-pill{
    display:inline-block;font-size:12px;font-weight:700;
    padding:4px 11px;border-radius:999px;
  }
  .status-pill.wait{background:#F1ECDD;color:var(--brass-deep);}
  .status-pill.done{background:var(--good-bg);color:var(--good);}

  .muted{color:var(--ink-soft);font-size:13px;}
  .divider{height:1px;background:var(--line);margin:20px 0;}

  table.admin-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.admin-table th,table.admin-table td{
    text-align:left;padding:10px 8px;border-bottom:1px solid var(--line);
    vertical-align:top;
  }
  table.admin-table th{color:var(--ink-soft);font-weight:600;font-size:12px;}
  .link-copy{
    display:inline-flex;align-items:center;gap:6px;font-size:12px;
    background:#F1ECDD;padding:5px 10px;border-radius:6px;cursor:pointer;border:none;
    color:var(--brass-deep);font-weight:600;
  }

  #toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#F1EEE4;padding:10px 18px;border-radius:8px;
    font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s ease;z-index:99;
  }
  #toast.show{opacity:1;}

  

  /* ---- 新增：stepper 六關 ---- */
  .stepper{overflow-x:auto;}
  .step{min-width:74px;font-size:12.5px;}

  /* ---- select ---- */
  select{
    width:100%;border:1px solid var(--line);background:#fff;border-radius:7px;
    padding:9px 10px;font-size:14px;font-family:inherit;color:var(--ink);
  }
  select:focus{outline:2px solid var(--brass);outline-offset:1px;border-color:var(--brass);}

  /* ---- HR 審核 ---- */
  .q{margin-bottom:18px;}
  .q > .q-title{font-weight:700;font-size:14px;margin-bottom:8px;}
  .opt-row{display:flex;flex-wrap:wrap;gap:8px;}
  .opt-row .opt{border:1px solid var(--line);background:#FCFBF8;padding:8px 14px;}
  .opt-row .opt.selected{border-color:var(--good);}
  .sub-card{border:1px solid var(--line);border-radius:9px;background:#FCFBF8;padding:16px;}
  .tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:#F1ECDD;color:var(--brass-deep);font-weight:600;margin-right:6px;}
  .tag.ok{background:var(--good-bg);color:var(--good);}
  .tag.bad{background:#F7E4DE;color:var(--seal);}

  /* ---- 檔案上傳 ---- */
  .file-block{margin-bottom:18px;}
  .file-item{display:flex;align-items:center;gap:8px;font-size:13.5px;padding:6px 0;}
  .file-item a{flex:1;word-break:break-all;}

  /* ---- 評分表 ---- */
  .score-head,.score-row{display:grid;grid-template-columns:minmax(0,1.2fr) 150px minmax(0,1.5fr) 28px;gap:8px;align-items:center;}
  .score-head{font-size:12px;color:var(--ink-soft);font-weight:600;margin-bottom:6px;}
  .score-row{margin-bottom:8px;}
  .score-row .sn{font-weight:600;font-size:14px;}
  .score-row input[type=text]{padding:8px 10px;font-size:14px;}
  .score-row .rm-slot{width:28px;}
  @media (max-width:640px){
    .score-head{display:none;}
    .score-row{grid-template-columns:minmax(0,1fr) 130px 28px;padding-bottom:10px;border-bottom:1px dashed var(--line);}
    .score-row .note{grid-column:1/-1;grid-row:2;}
    .score-row .sal-remove-btn{grid-column:3;grid-row:1;}
  }
  .sec-title{font-family:'Noto Serif TC',serif;font-weight:700;font-size:15px;margin:4px 0 12px;display:flex;align-items:baseline;gap:8px;}
  .sec-title small{font-family:'Noto Sans TC',sans-serif;font-weight:400;font-size:12px;color:var(--ink-soft);}
  .avg-line{display:flex;justify-content:space-between;font-size:13.5px;padding:8px 10px;background:#F4F2EC;border-radius:7px;margin-top:4px;}
  .total-box{
    margin-top:18px;border:1.5px solid var(--brass);border-radius:10px;background:#FCF8ED;padding:14px 18px;
  }
  .total-box .row{display:flex;justify-content:space-between;font-size:14px;padding:3px 0;}
  .total-box .grand{font-size:18px;font-weight:700;border-top:1px solid var(--line);margin-top:6px;padding-top:8px;}
  .band{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;}
  .band.b-strong{background:var(--good-bg);color:var(--good);}
  .band.b-ok{background:#E8F0EA;color:var(--good);}
  .band.b-cond{background:#F6EBCB;color:var(--brass-deep);}
  .band.b-no{background:#F7E4DE;color:var(--seal);}
  details.rubric{margin-top:16px;border:1px solid var(--line);border-radius:8px;padding:10px 14px;background:#FCFBF8;}
  details.rubric summary{cursor:pointer;font-weight:600;font-size:13.5px;}
  table.ro-table{width:100%;border-collapse:collapse;font-size:13.5px;}
  table.ro-table th,table.ro-table td{border-bottom:1px solid var(--line);padding:8px 6px;text-align:left;vertical-align:top;}
  table.ro-table th{font-size:12px;color:var(--ink-soft);font-weight:600;}
  table.ro-table td.sc{white-space:nowrap;font-weight:700;}

  /* ---- Print layout ---- */
  @page{ size: A4; margin: 0; }
  #printArea{
    display:none;width:210mm;box-sizing:border-box;padding:11mm;
    font-family:'Noto Sans TC',sans-serif;color:#000;
  }
  .p-title{text-align:center;font-size:17px;font-weight:700;margin-bottom:1mm;font-family:'Noto Serif TC',serif;}
  .p-sub{text-align:center;font-size:10.5px;margin-bottom:3mm;color:#333;}
  .p-info{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:10.5px;border:1px solid #000;padding:4px 8px;}
  .p-box{border:1px solid #000;border-top:none;padding:4px 8px;font-size:10px;}
  .p-box .p-h{font-weight:700;font-size:10.5px;margin-bottom:2px;}
  .p-table{width:100%;border-collapse:collapse;font-size:9.5px;}
  .p-table th,.p-table td{border:1px solid #000;padding:2px 5px;text-align:left;}
  .p-table th{background:#eee;}
  .p-table td.c{text-align:center;}
  .p-sign-row{display:grid;grid-template-columns:repeat(6,1fr);border:1px solid #000;border-top:none;}
  .p-sign-cell{border-right:1px solid #000;padding:3px 5px;font-size:9px;min-height:19mm;}
  .p-sign-cell:last-child{border-right:none;}
  .p-sign-cell img{max-height:12mm;max-width:100%;display:block;margin-top:2px;}
  @media print{
    body *{visibility:hidden;}
    #printArea,#printArea *{visibility:visible;}
    #printArea{position:absolute;left:0;top:0;display:block;}
  }
</style>
</head>

<script>
/* ============ Firebase 設定（yl-hire-approval 專案） ============ */
const firebaseConfig = {

const ADMIN_PASSCODE = "yl-hr-2026"; // 請自行修改

/* ============ 流程設定 ============ */
const STAGE_ORDER = ["hr","interviewer","unitManager","deptManager","executive","generalAffairs","completed"];

/* ============ 人資審核：選項 ============ */
const COMM_OPTIONS = ["表達清楚流暢","尚可，需引導","表達不清、不易溝通"];
const ATT_OPTIONS  = ["積極主動","普通","消極被動"];

/* ============ 評分表設定（依附件五） ============ */
const DEFAULT_SKILLS = ["電腦操作熟悉度","GOOGLE地圖應用",""];   // 第 3 項由用人主管自訂
const COMPETENCIES   = ["問題解決能力","團隊協作","跨部門協調能力"];
const MAX_SKILLS = 6;
const SCORE_VALUES = [5,4.5,4,3.5,3,2.5,2,1.5,1];
const SCORE_NAME = {5:"明確超出期望",4:"符合期望",3:"尚可但有疑慮",2:"明顯不足",1:"嚴重不符"};

const RUBRIC = [

];

function scoreOptionsHTML(sel){
  const o = [`<option value="">請選擇</option>`];
  SCORE_VALUES.forEach(v=>{
    const label = Number.isInteger(v) ? `${v.toFixed(1)}　${SCORE_NAME[v]}` : v.toFixed(1);
    o.push(`<option value="${v}" ${(sel!==null && sel!==undefined && sel!=='' && Number(sel)===v)?'selected':''}>${label}</option>`);
  });
  return o.join("");
}
function avgOf(rows){
  const a = rows.filter(r=>r.score!==null && r.score!=='' && r.score!==undefined).map(r=>Number(r.score));
  return a.length ? a.reduce((x,y)=>x+y,0)/a.length : null;
}
function activeSkills(scores){ return (scores.skills||[]).filter(r=>(r.name||'').trim()); }
function calcWeighted(scores){
  if(!scores) return {s:null,c:null,total:null};
  const sk = activeSkills(scores);
  const s = sk.length && sk.every(r=>r.score!=null && r.score!=='') ? avgOf(sk) : null;
  const co = scores.competencies||[];
  const c = co.length && co.every(r=>r.score!=null && r.score!=='') ? avgOf(co) : null;
  if(s===null || c===null) return {s,c,total:null};
  return {s,c,total: Math.round((s*W_SKILL + c*W_COMP)*100)/100};
}
function bandOf(t){
  if(t===null) return null;
  if(t>=4)   return {text:"強烈建議錄用", cls:"b-strong"};
  if(t>=3.5) return {text:"建議錄用，可進一步確認疑慮項目", cls:"b-ok"};
  if(t>=3)   return {text:"有條件錄用，需主管明確說明接受理由", cls:"b-cond"};
  return {text:"明確不錄用", cls:"b-no"};
}

const MEAL_ALLOWANCE = 3000;
const SALARY_VARIABLE = [
  {key:"projectAllowance", label:"專案津貼", amount:null},
  {key:"qualityLicense",   label:"專案品管證照津貼", amount:2000},
  {key:"safetyLicense",    label:"專案職安證照津貼", amount:3000},
  {key:"stationed",        label:"駐地津貼", amount:15000},
  {key:"transport3000",    label:"交通津貼（3,000）", amount:3000},
  {key:"transport6000",    label:"交通津貼（6,000）", amount:6000},
];
function emptySalary(){
  const items = {};
  SALARY_VARIABLE.forEach(v => items[v.key] = {checked:false, amount:v.amount});
  return {baseSalary: null, items, customItems: [], commitment: ""};
}
let DYNAMIC_SALARY_ITEMS = [];
async function loadDynamicSalaryItems(){
  try{
    const snap = await db.collection('salaryItems').orderBy('order','asc').get();
    DYNAMIC_SALARY_ITEMS = snap.docs.map(d=>{
      const v = d.data();
      return {key:d.id, label:v.label, amount:(v.amount!=null ? v.amount : null)};
    });
  }catch(err){ console.error('讀取薪資項目設定失敗：', err); DYNAMIC_SALARY_ITEMS = []; }
  return DYNAMIC_SALARY_ITEMS;
}
function allSalaryDefs(){ return SALARY_VARIABLE.concat(DYNAMIC_SALARY_ITEMS); }
function calcSalaryTotal(sal){
  if(!sal) return 0;
  let t = (Number(sal.baseSalary)||0) + MEAL_ALLOWANCE;
  allSalaryDefs().forEach(v=>{
    const it = sal.items && sal.items[v.key];
    if(it && it.checked) t += (Number(it.amount)||0);
  });
  (sal.customItems||[]).forEach(it=>{ if(it.checked) t += (Number(it.amount)||0); });
  return t;
}
function fmtMoney(n){ return "NT$ " + (Number(n)||0).toLocaleString('zh-TW'); }

function buildSalaryEditor(sal, prefix, required){
  sal = sal || emptySalary();
  const mark = required ? `<span class="req-mark">*</span>` : ``;
  const rows = allSalaryDefs().map(v=>{

    const isCustom = v.amount === null;
    return `
      <label class="sal-item">
        <input type="checkbox" id="${prefix}_chk_${v.key}" ${it.checked?'checked':''}>
        <span>${esc(v.label)}</span>
        ${isCustom
          ? `<input type="number" class="sal-amt" id="${prefix}_amt_${v.key}" placeholder="金額" value="${it.amount!=null?it.amount:''}">`
          : `<span class="sal-fixed-amt">NT$ ${Number(v.amount).toLocaleString('zh-TW')}</span>`}

  }).join("");
  const customItems = sal.customItems || [];

        <textarea id="${prefix}_commitment" placeholder="例如：年薪保障14個月；若無請填「無」">${esc(sal.commitment||"")}</textarea>
      </div>
      <div class="salary-total">核薪合計：<b id="${prefix}_total">${fmtMoney(calcSalaryTotal(sal))}</b></div>

function wireSalaryEditor(prefix){
  const block = $(`${prefix}_block`);
  if(!block) return;
  const recalc = ()=>{
    const t = $(`${prefix}_total`);
    if(t) t.textContent = fmtMoney(calcSalaryTotal(readSalaryFromForm(prefix)));
  };
  block.addEventListener('input', recalc);
  block.addEventListener('change', recalc);
  const addBtn = $(`${prefix}_addCustomBtn`);
  if(addBtn){
    addBtn.onclick = ()=>{
      const list = $(`${prefix}_custom_list`);
      list.style.marginTop = '8px';
      const row = document.createElement('label');
      row.className = 'sal-item sal-item-custom';
      row.innerHTML = `
        <input type="checkbox" class="sal-custom-chk" checked>
        <input type="text" class="sal-custom-label" placeholder="項目名稱">
        <input type="number" class="sal-amt sal-custom-amt" placeholder="金額">
        <button type="button" class="sal-remove-btn" title="刪除此項目">✕</button>`;
      list.appendChild(row);
      const li = row.querySelector('.sal-custom-label'); if(li) li.focus();
      recalc();
    };
  }
  block.addEventListener('click', e=>{
    const btn = e.target.closest('.sal-remove-btn');
    if(btn){ const row = btn.closest('.sal-item-custom'); if(row) row.remove(); recalc(); }
  });
}
function readSalaryFromForm(prefix){
  const baseEl = $(`${prefix}_base`);
  const base = baseEl ? baseEl.value : '';
  const items = {};
  allSalaryDefs().forEach(v=>{
    const chk = $(`${prefix}_chk_${v.key}`);
    let amount = v.amount;
    if(v.amount === null){
      const amtEl = $(`${prefix}_amt_${v.key}`);
      amount = amtEl && amtEl.value !== '' ? Number(amtEl.value) : null;
    }
    items[v.key] = {checked: chk ? chk.checked : false, amount};
  });
  const customItems = [];
  const customList = $(`${prefix}_custom_list`);
  if(customList){
    customList.querySelectorAll('.sal-item-custom').forEach(row=>{
      const chk = row.querySelector('.sal-custom-chk');
      const label = (row.querySelector('.sal-custom-label')||{value:''}).value.trim();
      const a = row.querySelector('.sal-custom-amt');
      const amtVal = a && a.value !== '' ? Number(a.value) : null;
      if(label || amtVal !== null) customItems.push({label, amount: amtVal, checked: chk ? chk.checked : false});
    });
  }
  const commitEl = $(`${prefix}_commitment`);
  return {baseSalary: base !== '' ? Number(base) : null, items, customItems, commitment: commitEl ? commitEl.value.trim() : ''};
}
function buildSalaryReadonly(sal){
  sal = sal || emptySalary();
  const checkedItems = allSalaryDefs().filter(v => sal.items && sal.items[v.key] && sal.items[v.key].checked);
  let rowsHTML = checkedItems.map(v=>{

}

/* ============ 小工具 ============ */
function toast(msg){
  const t = $('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__toastT);
  window.__toastT = setTimeout(()=>t.classList.remove('show'), 2400);
}
function fmtDate(ts){
  if(!ts) return "";
  const d = ts.toDate ? ts.toDate() : new Date(ts);
  return d.toLocaleString('zh-TW',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
function esc(s){
  return (s===null||s===undefined?"":s).toString().replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
const SERVER_TS = ()=>firebase.firestore.FieldValue.serverTimestamp();

/* 單選／複選的 .selected 外觀即時更新 */
document.addEventListener('change', e=>{
  const t = e.target;
  if(!(t && (t.type==='radio' || t.type==='checkbox'))) return;
  const wrap = t.closest('.opt'); if(!wrap) return;
  if(t.type==='radio'){
    document.querySelectorAll(`input[type=radio][name="${t.name}"]`).forEach(r=>{
      const w = r.closest('.opt'); if(w) w.classList.toggle('selected', r.checked);
    });
  } else wrap.classList.toggle('selected', t.checked);
});

function radioGroup(name, options, selected){
  // options: [{v,l}]
  return `<div class="opt-row">` + options.map(o=>`
    <label class="opt ${String(selected)===String(o.v)?'selected':''}">
      <input type="radio" name="${name}" value="${esc(o.v)}" ${String(selected)===String(o.v)?'checked':''}>
      <span>${esc(o.l)}</span>
    </label>`).join("") + `</div>`;
}

  consent: {field:"consentFiles", label:"應徵資料暨個資同意書"}

let fileState = {resume:[], consent:[]};   // 目前畫面上的檔案清單

function fileListHTML(kind, editable){

function buildFilesEditor(kind, p, required){

  return `

function wireFilesEditor(kind, p, id){
  $(`${p}_${kind}_btn`).onclick = ()=>uploadFiles(kind,p,id);
  $(`${p}_${kind}_input`).addEventListener('change', ()=>{ if($(`${p}_${kind}_input`).files.length) uploadFiles(kind,p,id); });
  $(`${p}_${kind}_list`).addEventListener('click', e=>{
    const b = e.target.closest('[data-rm]'); if(!b) return;
    removeFile(kind, parseInt(b.dataset.i,10), p, id);
  });
}
function refreshFileList(kind,p){ const el = $(`${p}_${kind}_list`); if(el) el.innerHTML = fileListHTML(kind,true); }

async function uploadFiles(kind,p,id){
  const k = FILE_KINDS[kind];
  const input = $(`${p}_${kind}_input`), status = $(`${p}_${kind}_status`), btn = $(`${p}_${kind}_btn`);
  const list = [...input.files];
  if(!list.length){ toast("請先選擇檔案"); return; }
  if(!storage){ toast("Storage 尚未設定，請確認 Firebase 設定"); return; }
  if(list.some(f=>f.size > 20*1024*1024)){ toast("單檔請小於 20MB"); return; }
  btn.disabled = true;
  try{
    for(let n=0;n<list.length;n++){
      const file = list[n];
      const path = `${COL}/${id}/${kind}/${Date.now()}_${file.name}`;
      const ref = storage.ref().child(path);
      const task = ref.put(file);
      task.on('state_changed', s=>{
        const pct = Math.round((s.bytesTransferred/s.totalBytes)*100);
        status.textContent = `上傳中（${n+1}/${list.length}）${pct}%`;
      });
      await task;
      const url = await ref.getDownloadURL();
      const entry = {url, name:file.name, path, uploadedAt:Date.now()};
      await db.collection(COL).doc(id).update({[k.field]: firebase.firestore.FieldValue.arrayUnion(entry), updatedAt: SERVER_TS()});
      fileState[kind].push(entry);
      if(currentDoc) currentDoc[k.field] = fileState[kind].slice();
    }
    input.value = ''; status.textContent = "已上傳"; toast(`${k.label}已上傳`);
    refreshFileList(kind,p);
  }catch(err){
    console.error(err); status.textContent = ""; toast("上傳失敗，請確認 Storage 設定是否正確");
  }finally{ btn.disabled = false; }
}
async function removeFile(kind, i, p, id){
  const k = FILE_KINDS[kind];
  const entry = fileState[kind][i]; if(!entry) return;
  if(!confirm(`確定要移除「${entry.name}」嗎？`)) return;
  try{
    await db.collection(COL).doc(id).update({[k.field]: firebase.firestore.FieldValue.arrayRemove(entry), updatedAt: SERVER_TS()});
    if(entry.path && storage) storage.ref().child(entry.path).delete().catch(()=>{});
    fileState[kind].splice(i,1);
    if(currentDoc) currentDoc[k.field] = fileState[kind].slice();
    refreshFileList(kind,p); toast("已移除");
  }catch(err){ console.error(err); toast("移除失敗，請確認網路連線"); }
}
function fileLinksHTML(doc){
  return Object.keys(FILE_KINDS).map(kind=>{
    const files = doc[FILE_KINDS[kind].field] || [];
    const body = files.length
      ? files.map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener" style="margin-right:12px;">📄 ${esc(f.name)}</a>`).join("")
      : `<span class="unanswered">尚未上傳</span>`;
    return `<div style="margin-top:10px;font-size:13.5px;"><span class="muted">${FILE_KINDS[kind].label}：</span>${body}</div>`;
  }).join("");
}

async function addSalaryItemDef(){

async function uploadFileCore(kind, id, file, onPct){
  const path = `${COL}/${id}/${kind}/${Date.now()}_${file.name}`;
  const ref = storage.ref().child(path);
  const task = ref.put(file);
  task.on('state_changed', s=>onPct && onPct(Math.round((s.bytesTransferred/s.totalBytes)*100)));
  await task;
  const url = await ref.getDownloadURL();
  const entry = {url, name:file.name, path, uploadedAt:Date.now()};
  await db.collection(COL).doc(id).update({[FILE_KINDS[kind].field]: firebase.firestore.FieldValue.arrayUnion(entry), updatedAt: SERVER_TS()});
  return entry;
}
async function createRecord(){
  const b = readBasics();

  const queue = [];
  [['resume','newResume'],['consent','newConsent']].forEach(([kind,elId])=>{
    const el = $(elId); if(el) [...el.files].forEach(f=>queue.push({kind,file:f}));

  if(queue.some(q=>q.file.size > 20*1024*1024)){ toast("單檔請小於 20MB"); return; }
  const btn = $('createBtn'); btn.disabled = true; btn.textContent = "建立中…";
  let newId = null;
  try{
    const ref = await db.collection(COL).add({
      ...b,
      status: 'hr',
      hrEval: emptyHrEval(),
      resumeFiles: [], consentFiles: [],
      scores: emptyScores(),
      hireDecision: null, decisionReason: "", qualCheck: false, startDate: "",

/* ============ 簽名板 ============ */
function setupSignaturePad(canvas){
  const ctx = canvas.getContext('2d');
  const ratio = window.devicePixelRatio || 1;
  const rect0 = canvas.getBoundingClientRect();
  canvas.width = rect0.width * ratio; canvas.height = rect0.height * ratio;
  ctx.scale(ratio, ratio); ctx.lineWidth = 2.2; ctx.lineCap = 'round'; ctx.strokeStyle = '#1B2A41';
  let drawing = false, hasInk = false, last = null;
  function pos(e){
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return {x:p.clientX-rect.left, y:p.clientY-rect.top};
  }
  function start(e){ e.preventDefault(); drawing = true; last = pos(e); }
  function move(e){
    if(!drawing) return; e.preventDefault();
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke();
    last = p; hasInk = true;
  }
  function end(){ drawing = false; }
  canvas.addEventListener('mousedown', start); canvas.addEventListener('mousemove', move);
  window.addEventListener('mouseup', end);
  canvas.addEventListener('touchstart', start, {passive:false});
  canvas.addEventListener('touchmove', move, {passive:false});
  canvas.addEventListener('touchend', end);
  return {
    clear(){ ctx.clearRect(0,0,canvas.width,canvas.height); hasInk = false; },
    isEmpty(){ return !hasInk; },
    dataURL(){ return canvas.toDataURL('image/png'); }
  };
}

function gatherHr(){
  const v = n => { const c = document.querySelector(`input[name="${n}"]:checked`); return c ? c.value : null; };

  const yes = contacted === 'yes';
  return {
    contacted,
    methods: yes ? [...document.querySelectorAll('input[name="hrMethod"]:checked')].map(x=>x.value) : [],
    date: yes ? $('hrDate').value : "",
    communication: yes && v('hrComm')!==null ? parseInt(v('hrComm'),10) : null,
    attitude:      yes && v('hrAtt') !==null ? parseInt(v('hrAtt'),10)  : null,
    experience:    yes ? v('hrExp') : null,

  };

function validateHr(g, doc){
  if(!g.contacted) return "請選擇「是否已有電訪或初面」";
  if(g.contacted === 'yes'){
    if(!g.methods.length) return "請勾選電訪或初面方式";
    if(!g.date) return "請填寫電訪／初面日期";
    if(g.communication === null) return "請勾選溝通能力";
    if(g.attitude === null) return "請勾選態度是否積極";
    if(!g.experience) return "請選擇是否具有相關經驗";
  }
  if(!(fileState.resume||[]).length) return "請上傳應徵者履歷表";
  if(!(fileState.consent||[]).length) return "請上傳應徵資料暨個資同意書";

function rubricHTML(){

function readScoresFromForm(){
  const skills = [...document.querySelectorAll('[data-skill-row]')].map(row=>{
    const sv = row.querySelector('.sk-score').value;
    return {name: row.querySelector('.sk-name').value.trim(), score: sv===''?null:Number(sv), note: row.querySelector('.sk-note').value.trim()};
  });
  const competencies = COMPETENCIES.map((name,i)=>{
    const row = document.querySelector(`[data-comp-row="${i}"]`);
    const sv = row.querySelector('.cp-score').value;
    return {name, score: sv===''?null:Number(sv), note: row.querySelector('.cp-note').value.trim()};
  });
  return {skills, competencies};
}
function refreshScoreSummary(){
  const sc = readScoresFromForm();
  const sk = activeSkills(sc);
  const sAvg = avgOf(sk), cAvg = avgOf(sc.competencies);
  $('avgSkill').textContent = f2(sAvg); $('avgComp').textContent = f2(cAvg);
  const w = calcWeighted(sc);
  $('wSkill').textContent = sAvg===null ? "—" : f2(sAvg*W_SKILL);
  $('wComp').textContent  = cAvg===null ? "—" : f2(cAvg*W_COMP);
  $('wTotal').textContent = f2(w.total);
  const b = bandOf(w.total);
  $('wBand').innerHTML = b ? `<span class="band ${b.cls}">${b.text}</span>` : `<span class="muted">全部項目評分後自動計算</span>`;
  const reasonStar = $('reasonStar');
  if(reasonStar){
    reasonStar.style.display = (w.total!==null && w.total<3.5) ? 'inline' : 'none';
  }
}
function wireScoreEditor(){
  const card = $('scoreCard');
  card.addEventListener('input', refreshScoreSummary);
  card.addEventListener('change', refreshScoreSummary);
  $('addSkillBtn').onclick = ()=>{
    const rows = document.querySelectorAll('[data-skill-row]');
    if(rows.length >= MAX_SKILLS){ toast(`專業技能最多 ${MAX_SKILLS} 項`); return; }
    $('skillRows').insertAdjacentHTML('beforeend', skillRowHTML({name:"",score:null,note:""}));
    const last = $('skillRows').lastElementChild.querySelector('.sk-name'); if(last) last.focus();
    refreshScoreSummary();
  };
  $('skillRows').addEventListener('click', e=>{
    const b = e.target.closest('.sk-rm'); if(!b) return;
    if(document.querySelectorAll('[data-skill-row]').length <= 1){ toast("至少保留一項專業技能"); return; }
    b.closest('[data-skill-row]').remove(); refreshScoreSummary();
  });
  refreshScoreSummary();
}
function buildScoresReadonlyCard(doc){

    // 尚未完成：仍顯示已填內容

      return `<div class="card"><h2 class="serif" style="margin-top:0;font-size:16px;">面試評分彙整</h2><span class="unanswered">尚未評分</span></div>`;

        <div class="row"><span>專業技能平均 × 60%</span><b>${w.s===null?'—':f2(w.s*W_SKILL)}</b></div>

      </div>
      <div class="field-row">

            <input type="checkbox" id="qualCheck" ${doc.qualCheck?'checked':''}><span>已完成（依個資同意書）</span>
          </label>
        </div>
        <div><label for="startDateInput">到職日</label><input type="date" id="startDateInput" value="${esc(doc.startDate||'')}"></div>
      </div>
    </div>`;
}
function buildDecisionReadonly(doc){
  const d = doc.hireDecision;
  const cls = d==='錄用' ? 'ok' : (d==='不錄用' ? 'bad' : '');
  return `
    <div class="card">
      <h2 class="serif" style="margin-top:0;font-size:16px;">四、錄用決策（用人主管）</h2>
      <div class="salary-row"><span>用人主管錄用建議</span>${d?`<span class="tag ${cls}">${esc(d)}</span>`:'<span class="unanswered">尚未填寫</span>'}</div>
      ${doc.decisionReason?`<div style="margin-top:10px;"><div class="comment-label" style="font-size:14px;">理由</div><div class="comment-box" style="font-size:14.5px;">${esc(doc.decisionReason)}</div></div>`:''}
      <div class="salary-row" style="margin-top:10px;"><span>資歷查核（依個資同意書）</span>${doc.qualCheck?'<span class="tag ok">已完成</span>':'<span class="tag">未勾選</span>'}</div>
      <div class="salary-row" style="margin-top:8px;"><span>到職日</span><span class="sal-fixed-amt">${doc.startDate?esc(doc.startDate):'<span class="unanswered">尚未填寫</span>'}</span></div>
    </div>`;
}
function gatherInterviewer(){
  const c = document.querySelector('input[name="hireDecision"]:checked');
  return {
    scores: readScoresFromForm(),
    hireDecision: c ? c.value : null,
    decisionReason: $('reasonInput').value.trim(),
    qualCheck: $('qualCheck').checked,
    startDate: $('startDateInput').value,
    salary: readSalaryFromForm('sal')
  };
}
function validateInterviewer(g){
  const sk = g.scores.skills;
  if(sk.some(r=>!r.name && r.score!==null)) return "有評分的技能項目請填寫技能名稱";
  const act = sk.filter(r=>r.name);
  if(!act.length) return "請至少填寫一項專業技能";
  if(act.some(r=>r.score===null)) return "請完成所有專業技能的評分（不需要的列請按 ✕ 移除）";
  if(g.scores.competencies.some(r=>r.score===null)) return "請完成所有軟性職能的評分";
  if(!g.hireDecision) return "請選擇用人主管錄用建議";
  const w = calcWeighted(g.scores);
  if((w.total<3.5 || g.hireDecision!=='錄用') && !g.decisionReason) return "加權總分低於 3.5 或非「錄用」時，請填寫理由";
  if(g.hireDecision !== '不錄用'){
    if(!g.startDate) return "請填寫到職日";
    if(g.salary.baseSalary===null || isNaN(g.salary.baseSalary)) return "請填寫本薪";
    if(!g.salary.commitment) return "請填寫薪資承諾，若無請填「無」";
  }
  return null;
}

/* ============ 表單／檢視畫面（簽核人連結，依 status 切換） ============ */
async function renderFormView(id){
  app.innerHTML = `<div class="muted">載入中…</div>`;
  let doc;
  try{
    const snap = await db.collection(COL).doc(id).get();
    if(!snap.exists){ app.innerHTML = `<div class="card">找不到這筆紀錄，連結可能有誤。</div>`; return; }
    doc = snap.data();
  }catch(err){ console.error(err); app.innerHTML = `<div class="card">載入失敗，請確認 Firebase 設定是否正確。</div>`; return; }
  await loadDynamicSalaryItems();

  currentDoc = doc;
  fileState = {resume:(doc.resumeFiles||[]).slice(), consent:(doc.consentFiles||[]).slice()};

  const st = doc.status, idx = STAGE_ORDER.indexOf(st);
  const isHr = st==='hr', isIv = st==='interviewer', isExec = st==='executive';
  const editable = st !== 'completed';

  let html = headerCardHTML(doc) + stepperHTML(doc);

  if(isHr){
    html += buildHrEditor(doc);
    html += `<div class="card"><h2 class="serif" style="margin-top:0;font-size:16px;">應徵附件<span class="req-mark">*</span></h2>
      <p class="muted" style="margin-top:0;">可一次選取多個檔案（PDF、圖片、Word，單檔 20MB 內）。</p>
      ${buildFilesEditor('resume','hr',true)}${buildFilesEditor('consent','hr',true)}</div>`;
  } else {
    html += buildHrReadonly(doc);
  }

  if(isIv){
    html += buildScoreEditor(doc) + buildDecisionEditor(doc);
    html += `<div class="card"><h2 class="serif" style="margin-top:0;font-size:16px;">核薪（建議錄取薪資）</h2>
      <p class="muted" style="margin-top:0;">錄用或候補時請填寫；若為「不錄用」可略過。</p>
      ${buildSalaryEditor(doc.salaryProposal,'sal',false)}</div>`;
  } else if(idx > 1){
    html += buildScoresReadonlyCard(doc) + buildDecisionReadonly(doc);
    if(isExec){
      html += `<div class="card"><h2 class="serif" style="margin-top:0;font-size:16px;">核薪核定</h2>
        <p class="muted" style="margin-top:0;">以下為面試主管建議薪資，您可以確認或修改後再簽核。</p>
        ${buildSalaryEditor(doc.salaryFinal || doc.salaryProposal,'salFinal',false)}</div>`;
    } else {
      const title = (st==='generalAffairs'||st==='completed') ? '核薪核定' : '建議錄取薪資';
      html += `<div class="card"><h2 class="serif" style="margin-top:0;font-size:16px;">${title}</h2>${buildSalaryReadonly((st==='generalAffairs'||st==='completed') ? (doc.salaryFinal||doc.salaryProposal) : doc.salaryProposal)}</div>`;
    }
  }

  html += signedCardHTML(doc);

  if(st==='completed'){
    html += `<div class="card" style="background:var(--good-bg);border-color:var(--good);"><b style="color:var(--good);">六關簽核皆已完成。</b><p class="muted" style="margin:6px 0 0;">此連結僅供檢視。如需紙本存查，可至管理後台使用「轉出PDF」。</p></div>`;
  }
  if(editable){
    const showDraft = (isHr || isIv || isExec);
    html += `
      <div class="card">
        <h2 class="serif" style="margin-top:0;font-size:16px;">${STAGE_LABEL[st]}簽核</h2>
        <label>簽名（請直接於下方簽名）</label>
        <canvas class="sig-box" id="sigPad"></canvas>
        <div class="sig-tools">
          <span class="sig-hint">簽好後直接送出即可</span>
          <button class="btn-ghost" id="sigClear" type="button" style="padding:6px 14px;font-size:12px;">清除重簽</button>
        </div>
        <div style="margin-top:18px;display:flex;gap:10px;flex-wrap:wrap;">
          ${showDraft ? `<button class="btn-ghost" id="draftBtn">儲存草稿</button>` : ``}
          <button class="btn-primary" id="submitBtn">確認送出並簽名</button>
        </div>
      </div>`;
  }
  app.innerHTML = html;

  if(isHr){
    wireHrEditor();
    wireFilesEditor('resume','hr',id); wireFilesEditor('consent','hr',id);
  }
  if(isIv){ wireScoreEditor(); wireSalaryEditor('sal'); }
  if(isExec) wireSalaryEditor('salFinal');

  if(editable){
    const pad = setupSignaturePad($('sigPad'));
    $('sigClear').onclick = ()=>pad.clear();
    const draftBtn = $('draftBtn');
    if(draftBtn) draftBtn.onclick = ()=>saveDraft(id, st);
    $('submitBtn').onclick = ()=>submitStage(id, doc, pad);
  }
}

async function saveDraft(id, role){
  const btn = $('draftBtn');
  if(btn){ btn.disabled = true; btn.textContent = "儲存中…"; }
  try{
    const payload = {updatedAt: SERVER_TS()};
    if(role==='hr'){
      payload.hrEval = gatherHr();
    } else if(role==='interviewer'){
      const g = gatherInterviewer();
      payload.scores = g.scores; payload.hireDecision = g.hireDecision; payload.decisionReason = g.decisionReason;
      payload.qualCheck = g.qualCheck; payload.startDate = g.startDate; payload.salaryProposal = g.salary;
    } else if(role==='executive'){
      payload.salaryFinal = readSalaryFromForm('salFinal');
    }
    await db.collection(COL).doc(id).update(payload);
    toast("草稿已儲存");
  }catch(err){ console.error(err); toast("儲存失敗，請確認網路連線"); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = "儲存草稿"; } }
}

async function submitStage(id, doc, pad){
  const role = doc.status;
  if(pad.isEmpty()){ toast("請先簽名"); return; }
  const payload = {
    [role]: {signature: pad.dataURL(), signedAt: SERVER_TS()},
    status: STAGE_ORDER[STAGE_ORDER.indexOf(role)+1],
    updatedAt: SERVER_TS()
  };
  if(role==='hr'){
    const g = gatherHr(); const err = validateHr(g, doc);
    if(err){ toast(err); return; }
    payload.hrEval = g;
  }
  if(role==='interviewer'){
    const g = gatherInterviewer(); const err = validateInterviewer(g);
    if(err){ toast(err); return; }
    payload.scores = g.scores; payload.hireDecision = g.hireDecision; payload.decisionReason = g.decisionReason;
    payload.qualCheck = g.qualCheck; payload.startDate = g.startDate; payload.salaryProposal = g.salary;
  }
  if(role==='executive') payload.salaryFinal = readSalaryFromForm('salFinal');

  const btn = $('submitBtn'); btn.disabled = true; btn.textContent = "送出中…";
  try{
    await db.collection(COL).doc(id).update(payload);
    toast("已送出簽核"); renderFormView(id);
  }catch(err){ console.error(err); toast("送出失敗，請確認網路連線或 Firebase 設定"); btn.disabled = false; btn.textContent = "確認送出並簽名"; }
}

/* ============ 列印／匯出 PDF ============ */
function buildSalaryPrintLines(sal){
  sal = sal || emptySalary();
  const L = [];
  L.push(`本薪：${sal.baseSalary!=null ? Number(sal.baseSalary).toLocaleString('zh-TW') : '未填寫'} 元`);
  L.push(`伙食費：${MEAL_ALLOWANCE.toLocaleString('zh-TW')} 元`);
  allSalaryDefs().forEach(v=>{
    const it = sal.items && sal.items[v.key];
    if(it && it.checked) L.push(`${esc(v.label)}：${(Number(it.amount)||0).toLocaleString('zh-TW')} 元`);
  });
  (sal.customItems||[]).forEach(it=>{
    if(it.checked && (it.label || it.amount)) L.push(`${esc(it.label||'未命名項目')}：${(Number(it.amount)||0).toLocaleString('zh-TW')} 元`);
  });
  let out = L.join("　｜　");
  out += `<div><b>合計：${calcSalaryTotal(sal).toLocaleString('zh-TW')} 元</b>${sal.commitment?`　薪資承諾：${esc(sal.commitment)}`:''}</div>`;
  return out;
}
async function printRecord(id){
  const snap = await db.collection(COL).doc(id).get();
  if(!snap.exists){ toast("找不到紀錄"); return; }
  const d = snap.data();
  await loadDynamicSalaryItems();
  const bx = b => b ? '■' : '□';
  const h = d.hrEval || emptyHrEval();
  const sc = d.scores || emptyScores();
  const w = calcWeighted(sc), b = bandOf(w.total);

  const hrBody = h.contacted === 'yes'
    ? `是否已有電訪或初面：${bx(true)}是（${esc((h.methods||[]).join("、"))}　${esc(h.date||'')}）　${bx(false)}否<br>
       溝通能力：${COMM_OPTIONS.map((o,i)=>`${bx(h.communication===i)}${o}`).join("　")}<br>
       態度是否積極：${ATT_OPTIONS.map((o,i)=>`${bx(h.attitude===i)}${o}`).join("　")}<br>
       是否具有相關經驗：${bx(h.experience==='yes')}是　${bx(h.experience==='no')}否`
    : `是否已有電訪或初面：${bx(false)}是　${bx(h.contacted==='no')}否`;
  const rows = (arr)=>arr.map((r,i)=>`<tr><td class="c" style="width:7%">${i+1}</td><td>${esc(r.name)}</td><td class="c" style="width:14%">${r.score!=null?Number(r.score).toFixed(1):''} /5</td><td style="width:38%">${esc(r.note||'')}</td></tr>`).join("");
  const fileNames = k => (d[FILE_KINDS[k].field]||[]).map(f=>esc(f.name)).join("、") || "—";

  function signCell(role){
    const s = d[role];
    if(!s) return `<div class="p-sign-cell"><b>${STAGE_LABEL[role]}</b></div>`;
    return `<div class="p-sign-cell"><b>${STAGE_LABEL[role]}</b><img src="${s.signature}"><div>${fmtDate(s.signedAt)}</div></div>`;
  }

  $('printArea').innerHTML = `
    <div class="p-title">錄取簽呈表</div>
    <div class="p-sub">永隆工程 · 面試評分彙整與錄用決策表（附件五）</div>
    <div class="p-info">
      <span>應徵者：${esc(d.candidateName)}</span><span>應徵部門：${esc(d.department)}</span>
      <span>應徵職務：${esc(d.position)}</span><span>面談日期：${esc(d.interviewDate)}</span>
    </div>
    <div class="p-box"><div class="p-h">人資審核</div>${hrBody}
      ${h.note?`<br>備註：${esc(h.note)}`:''}
      <br>附件：履歷表（${fileNames('resume')}）；應徵資料暨個資同意書（${fileNames('consent')}）（電子檔請於系統內查看）</div>
    <div class="p-box"><div class="p-h">一、專業技能（60%）</div>
      <table class="p-table"><thead><tr><th>序號</th><th>技能名稱</th><th>評分</th><th>備註</th></tr></thead><tbody>${rows(activeSkills(sc))}
      <tr><td></td><td><b>技能平均</b></td><td class="c"><b>${f2(w.s)}</b></td><td></td></tr></tbody></table></div>
    <div class="p-box"><div class="p-h">二、軟性職能（40%）</div>
      <table class="p-table"><thead><tr><th>序號</th><th>職能名稱</th><th>評分</th><th>備註</th></tr></thead><tbody>${rows(sc.competencies||[])}
      <tr><td></td><td><b>職能平均</b></td><td class="c"><b>${f2(w.c)}</b></td><td></td></tr></tbody></table></div>
    <div class="p-box"><div class="p-h">三、加權總分</div>
      專業技能平均 × 60% ＝ ${w.s===null?'—':f2(w.s*W_SKILL)}　｜　軟性職能平均 × 40% ＝ ${w.c===null?'—':f2(w.c*W_COMP)}　｜　<b>加權總分 ${f2(w.total)} / 5</b>${b?`（${b.text}）`:''}
      <br><span style="color:#444;">決策參考：4.0–5.0 強烈建議錄用；3.5–3.9 建議錄用；3.0–3.4 有條件錄用，需主管說明接受理由；&lt;3.0 明確不錄用</span></div>
    <div class="p-box"><div class="p-h">四、錄用決策</div>
      用人主管錄用建議：${HIRE_OPTIONS.map(o=>`${bx(d.hireDecision===o)}${o}`).join("　")}<br>
      理由：${esc(d.decisionReason||'')}<br>
      資歷查核：${bx(d.qualCheck)}已完成（依個資同意書）　　到職日：${esc(d.startDate||'')}<br>
      核薪核定：${buildSalaryPrintLines(d.salaryFinal || d.salaryProposal)}</div>
    <div class="p-sign-row">${SIGN_STAGES.map(signCell).join("")}</div>
  `;
  fitPrintAreaToA4();
  setTimeout(()=>window.print(), 80);
}
function fitPrintAreaToA4(){
  const el = $('printArea');
  el.style.zoom = 1; el.style.display = 'block'; el.style.position = 'fixed'; el.style.left = '-10000px'; el.style.top = '0';
  const pageHeightPx = 297 * (96/25.4);
  const contentHeightPx = el.scrollHeight;
  let scale = contentHeightPx > pageHeightPx ? (pageHeightPx / contentHeightPx) : 1;
  if(scale < 1) scale = scale * 0.96;
  el.style.zoom = scale;
  el.style.display = ''; el.style.position = ''; el.style.left = ''; el.style.top = '';
}

route();
</script>
</body>
</html>
